name: RIGAUTH Windows desktop
on:
  workflow_dispatch:
  push:
    branches: [desktop/windows-standalone]
    paths:
      - 'desktop/windows-standalone/**'
      - '.github/workflows/rigauth-windows.yml'
concurrency:
  group: rigauth-windows-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop/windows-standalone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate JavaScript syntax
        run: |
          node --check src/main.js
          node --check src/app.js
          node --check src/preload.js
          node --check scripts/create-template.js
          node --check scripts/verify-template.js
      - name: Create fresh SQLite template
        run: node scripts/create-template.js
      - name: Verify SQLite template integrity
        run: node scripts/verify-template.js
      - name: Build installer
        run: npm run dist
      - name: Launch Electron smoke test
        run: npm run smoke
      - name: Verify bundled database template
        shell: pwsh
        run: |
          if (-not (Test-Path data/rigauth-template.sqlite)) { throw 'SQLite template was not generated.' }
          Get-Item data/rigauth-template.sqlite | Format-List
      - name: Smoke-check outputs
        shell: pwsh
        run: |
          $setup = Get-ChildItem release -Filter 'RIGAUTH-Setup-*.exe'
          $portable = Get-ChildItem release -Filter 'RIGAUTH-*-Portable.exe'
          if (-not $setup) { throw 'Installer was not produced.' }
          if (-not $portable) { throw 'Portable executable was not produced.' }
          Get-FileHash $setup.FullName -Algorithm SHA256 | Format-List
          Get-FileHash $portable.FullName -Algorithm SHA256 | Format-List
      - name: Create simple launch filenames
        shell: pwsh
        run: |
          $setup = Get-ChildItem release -Filter 'RIGAUTH-Setup-*.exe' | Select-Object -First 1
          $portable = Get-ChildItem release -Filter 'RIGAUTH-*-Portable.exe' | Select-Object -First 1
          Copy-Item $setup.FullName release/RIGAUTH-Setup.exe -Force
          Copy-Item $portable.FullName release/RIGAUTH.exe -Force
      - name: Create versioned release archive
        shell: pwsh
        run: Compress-Archive -Path release/*.exe, README.md -DestinationPath release/RIGAUTH-Windows-x64-1.0.0.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: RIGAUTH-Windows-x64
          path: desktop/windows-standalone/release/*
          if-no-files-found: error
          retention-days: 30
